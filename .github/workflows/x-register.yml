name: x-account-register

on:
  workflow_dispatch:
    inputs:
      email:
        description: 'X account email'
        required: true
        default: ''
      username:
        description: 'Desired X username'
        required: true
        default: ''
      password:
        description: 'X account password'
        required: true
        default: ''
      phone:
        description: 'Phone for SMS verification (E.164, e.g. +8619137767895)'
        required: true
        default: ''
      otp:
        description: 'SMS verification code (fill on 2nd run)'
        required: false
        default: ''
      resume:
        description: 'resume from saved state'
        required: false
        default: 'true'

jobs:
  register:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: |
          pip install playwright
          python -m playwright install chromium --with-deps
      - name: Run X registration
        env:
          X_EMAIL: ${{ github.event.inputs.email }}
          X_USERNAME: ${{ github.event.inputs.username }}
          X_PASSWORD: ${{ github.event.inputs.password }}
          X_PHONE: ${{ github.event.inputs.phone }}
          X_OTP: ${{ github.event.inputs.otp }}
        run: |
          python x_register.py 2>&1 | tee x_register.log
      - name: Commit state back to repo
        run: |
          git config user.name "x-bot"
          git config user.email "x-bot@users.noreply.github.com"
          git add x_state.json x_cookies.json x_register.log 2>/dev/null || true
          git commit -m "x-register state update [skip ci]" 2>/dev/null || echo "no changes"
          git push origin main 2>&1 | tail -3 || echo "push failed (maybe no changes)"
      - name: Upload state
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: x-register-state
          path: |
            x_state.json
            x_cookies.json
            x_*.png
            x_register.log
          retention-days: 7
